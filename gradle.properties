# Portable project defaults only.
#
# Anything specific to one machine -- a JDK location, a heap size, an aapt2
# override, whether the daemon runs -- belongs in your own
# ~/.gradle/gradle.properties. Values there take precedence over this file, so a
# local path written here would break the build for everyone who clones the repo.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
